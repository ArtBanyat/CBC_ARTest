<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- 1. ไฟล์ target.mind นี้จะต้องถูก Compile ให้มีรูปภาพเป้าหมาย 3 รูปอยู่ข้างในไฟล์เดียว -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 2. นำเข้าไฟล์ 3D โมเดลทั้ง 3 ชิ้น (ตั้ง id ให้ต่างกัน) -->
        <a-asset-item id="model1" src="./model-1.glb"></a-asset-item>
        <a-asset-item id="model2" src="./model-2.glb"></a-asset-item>
        <a-asset-item id="model3" src="./model-3.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 3. กำหนด Target ที่ 1 (สแกนรูปที่ 1 จะขึ้น model-1) -->
      <!-- targetIndex: 0 คือรูปภาพลำดับแรกสุดในไฟล์ target.mind -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5" src="#model1"></a-gltf-model>
      </a-entity>

      <!-- 4. กำหนด Target ที่ 2 (สแกนรูปที่ 2 จะขึ้น model-2) -->
      <!-- targetIndex: 1 คือรูปภาพลำดับที่สอง -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5" src="#model2"></a-gltf-model>
      </a-entity>

      <!-- 5. กำหนด Target ที่ 3 (สแกนรูปที่ 3 จะขึ้น model-3) -->
      <!-- targetIndex: 2 คือรูปภาพลำดับที่สาม -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5" src="#model3"></a-gltf-model>
      </a-entity>
      
    </a-scene>
  </body>
</html>
