<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- โหลดสคริปต์ A-Frame และ MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- 
      จุดที่ 1: กำหนดไฟล์รูปภาพที่จะใช้สแกน 
      (ต้องเป็นไฟล์นามสกุล .mind ซึ่งดูวิธีแปลงไฟล์ได้ที่คำแนะนำด้านล่าง) 
    -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 
          จุดที่ 2: ใส่ชื่อไฟล์ 3D โมเดลของคุณ (เช่น ไฟล์กล่องพลาสติก .glb) 
          นำไฟล์มาวางไว้ในโฟลเดอร์เดียวกันแล้วเปลี่ยนชื่อตรง src ให้ตรงกัน
        -->
        <a-asset-item id="myModel" src="./firework.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- ส่วนนี้คือการนำโมเดลมาผูกกับรูปภาพที่สแกน -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 
          จุดที่ 3: ปรับขนาด (scale) หรือตำแหน่ง (position) ของโมเดล 
          หากสแกนแล้วโมเดลใหญ่หรือเล็กไป ให้มาเปลี่ยนตัวเลขตรง scale="1 1 1"
        -->
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5" src="#myModel"></a-gltf-model>
      </a-entity>
      
    </a-scene>
  </body>
</html>
