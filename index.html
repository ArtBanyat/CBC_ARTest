<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- 1. กำหนดไฟล์รูปภาพที่จะใช้สแกน (.mind) -->
    <<!-- แก้ไขแท็ก a-scene บรรทัดนี้ -->
<a-scene mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; uiLoading: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- 2. ใส่ชื่อไฟล์ 3D โมเดลของคุณ (.glb) -->
        <a-asset-item id="myModel" src="./plaggy_cc0-pencil-566.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 3. ปรับขนาด (scale) หรือตำแหน่ง (position) ของโมเดล -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#myModel"></a-gltf-model>
      </a-entity>
      
    </a-scene>
  </body>
</html>
