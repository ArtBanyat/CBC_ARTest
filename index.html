<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- โหลดไลบรารี A-Frame และ MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      
      /* ตกแต่งปุ่มชัตเตอร์ถ่ายรูป */
      #capture-btn {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        background-color: rgba(255, 255, 255, 0.5);
        border: 4px solid white;
        border-radius: 50%;
        z-index: 1000;
        cursor: pointer;
        display: none; /* ซ่อนไว้จนกว่ากล้องจะพร้อม */
      }
      #capture-btn:active {
        background-color: rgba(255, 255, 255, 0.9);
      }
    </style>
  </head>
  <body>
    
    <!-- ปุ่มถ่ายรูป -->
    <button id="capture-btn"></button>

    <!-- 
      ตั้งค่า Scene: 
      1. เปลี่ยน ./target.mind เป็นไฟล์รูปเป้าหมายของคุณ
      2. uiLoading: no; และ uiScanning: no; (เพื่อปิดกรอบสแกน)
      3. preserveDrawingBuffer: true (จำเป็นมากสำหรับการถ่ายรูป 3D)
    -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights, preserveDrawingBuffer: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- เปลี่ยนชื่อไฟล์เป็น 3D โมเดลของคุณ (.glb) -->
        <a-asset-item id="myModel" src="./plaggy_cc0-pencil-566.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- 
          [วิธีเปิดการหมุน] 
          หากต้องการให้โมเดลหมุน ให้ก๊อปปี้บรรทัดด้านล่างนี้ ไปใส่ต่อท้ายในแท็ก <a-gltf-model>
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;" 
        -->
        <a-gltf-model 
          src="#myModel" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="0 0 0"
        ></a-gltf-model>

      </a-entity>
    </a-scene>

    <!-- สคริปต์สำหรับปุ่มถ่ายรูป (รวมกล้องและ 3D เข้าด้วยกัน) -->
    <script>
      const captureBtn = document.getElementById('capture-btn');
      
      // แสดงปุ่มถ่ายรูปก็ต่อเมื่อระบบ AR โหลดกล้องเสร็จแล้ว
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('arReady', () => {
        captureBtn.style.display = 'block';
      });

      captureBtn.addEventListener('click', () => {
        const video = document.querySelector('video');
        const canvas = document.querySelector('canvas');
        
        if (!video || !canvas) return;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const ctx = tempCanvas.getContext('2d');

        // คำนวณสัดส่วนวิดีโอเพื่อไม่ให้ภาพเบี้ยว
        const videoRatio = video.videoWidth / video.videoHeight;
        const canvasRatio = canvas.width / canvas.height;
        let drawWidth, drawHeight, startX, startY;

        if (videoRatio > canvasRatio) {
            drawHeight = canvas.height;
            drawWidth = canvas.height * videoRatio;
            startX = (canvas.width - drawWidth) / 2;
            startY = 0;
        } else {
            drawWidth = canvas.width;
            drawHeight = canvas.width / videoRatio;
            startX = 0;
            startY = (canvas.height - drawHeight) / 2;
        }

        // 1. วาดพื้นหลัง (ภาพจากกล้อง)
        ctx.drawImage(video, startX, startY, drawWidth, drawHeight);
        // 2. วาดภาพ 3D ทับลงไป
        ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height);

        // แปลงภาพและสั่งดาวน์โหลด
        const link = document.createElement('a');
        link.download = 'AR-Photo.png'; // เปลี่ยนชื่อไฟล์ภาพที่จะเซฟได้ที่นี่
        link.href = tempCanvas.toDataURL('image/png');
        link.click();
      });
    </script>
  </body>
</html>
